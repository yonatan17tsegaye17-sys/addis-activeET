<style>
:root{--bg:#0a1020;--s1:#111a2e;--s2:#17233e;--line:rgba(255,255,255,.08);--gold:#f5c518;--green:#22c55e;--red:#ef4444;--blue:#60a5fa;--text:#f1f5f9;--muted:#8b9ab3}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(900px 420px at 50% -160px,#183057 0%,var(--bg) 62%) fixed;color:var(--text);margin:0;padding-bottom:116px;-webkit-tap-highlight-color:transparent}
.top{background:rgba(10,16,32,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:15px 16px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.top::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#078930 0 33.3%,#fcdd09 33.3% 66.6%,#da121a 66.6%)}
.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.3px}
.pill{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);padding:5px 11px;border-radius:999px;font-size:11px;color:var(--green);font-weight:700}
#view{padding:16px}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.card h3{margin:0 0 6px;font-size:18px;font-weight:700}
.card p{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.5}
.hero{background:linear-gradient(135deg,#14532d 0%,#0f2a4d 58%,#0a1020 100%);border-color:rgba(255,255,255,.14)}
.eyebrow{font-size:11px;color:var(--gold);font-weight:800;margin-bottom:6px;letter-spacing:1.2px}
.sec{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1.4px;margin:24px 2px 10px}
.btn{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;border:0;width:100%;padding:14px;border-radius:14px;font-size:14px;font-weight:800;letter-spacing:.4px;cursor:pointer;box-shadow:0 6px 16px rgba(34,197,94,.28)}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:var(--s2);color:var(--green);box-shadow:none;border:1px solid var(--line)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;margin-right:6px;border:1px solid var(--line);color:var(--muted);letter-spacing:.4px}
.badge.demo{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.badge.ok{color:var(--green);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
.media{width:100%;height:160px;border-radius:16px;margin-bottom:14px;background:radial-gradient(circle at 80% 20%,rgba(245,197,24,.25),transparent 45%),linear-gradient(135deg,#14532d,#1e3a8a);background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line)}
video.media{height:auto}
.play{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:17px}
.mt{font-size:11px;font-weight:800;margin-top:10px;letter-spacing:1px}.ms{font-size:11px;color:#cbd5e1}
input,select{width:100%;background:var(--s1);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;margin-bottom:10px;outline:0}
input:focus,select:focus{border-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--gold);color:#0a1020;border-color:var(--gold);font-weight:800}
.exh h2{margin:0 0 14px;font-size:27px;font-weight:800;line-height:1.15}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 16px}
.tile{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:18px;padding:14px 6px 12px;text-align:center;cursor:pointer}
.tile .te{display:block;font-size:28px;margin-bottom:6px}
.tile b{display:block;font-size:12px;font-weight:700}
.tile small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.tile.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 20px rgba(245,197,24,.15)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border:0}.muted{color:var(--muted)}
.item{cursor:pointer}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(17,26,46,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;display:flex;align-items:flex-end;padding:8px 6px 10px;z-index:1000;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.tab{flex:1;text-align:center;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;padding-top:4px}
.tab i{display:block;font-style:normal}
.tab svg{width:22px;height:22px;display:block;margin:0 auto 3px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gold)}
.tab.ex{color:var(--text)}
.tab.ex i{display:flex;width:60px;height:60px;margin:-32px auto 5px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#15803d);align-items:center;justify-content:center;border:4px solid var(--bg);box-shadow:0 8px 22px rgba(34,197,94,.5)}
.tab.ex i svg{width:28px;height:28px;margin:0;stroke:#fff}
.tab.ex.on{color:var(--gold)}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:2000;overflow-y:auto;padding:16px 16px 40px;display:none}
#toast{position:fixed;left:16px;right:16px;bottom:120px;background:#0b1220;border:1px solid var(--line);padding:13px;border-radius:14px;font-size:13px;z-index:3000;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.lock{opacity:.4}
.bar{height:8px;background:var(--s1);border-radius:99px;overflow:hidden;margin:10px 0 4px;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,var(--gold));border-radius:99px}
details summary{cursor:pointer;color:var(--gold);font-size:12px;font-weight:700;margin-top:10px}
#map{height:62vh;border-radius:18px;border:1px solid var(--line);overflow:hidden}
.leaflet-container{background:#0a1020}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.7)}
.leaflet-control-attribution{background:rgba(10,16,32,.75)!important;color:#8b9ab3!important}.leaflet-control-attribution a{color:#cbd5e1!important}
.tab{font-size:9.5px}.tab.ex i{width:54px;height:54px;margin:-26px auto 5px}.tab.ex i svg{width:25px;height:25px}
.tab.ex.ter i{background:linear-gradient(135deg,#f5c518,#d97706);box-shadow:0 8px 22px rgba(245,197,24,.45)}
#map{height:56vh}
html{background:#060b17}
body{max-width:560px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.55)}
.nav{left:50%;right:auto;width:min(536px,calc(100% - 24px));transform:translateX(-50%)}
#sheet{left:50%;right:auto;width:100%;max-width:560px;transform:translateX(-50%)}
#toast{left:50%;right:auto;width:min(528px,calc(100% - 32px));transform:translateX(-50%)}
.tab{white-space:nowrap}.tab.ex{flex:1.35;font-size:9px}
.tab.ex.ter i{display:block}
#map{height:40vh;min-height:260px}
.icon{background:var(--s2);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:12px;font-size:15px;cursor:pointer}
#map{height:42vh}
#splash{position:fixed;inset:0;background:var(--bg);z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#splash .sb{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#078930 0 33.3%,#fcdd09 33.3% 66.6%,#da121a 66.6%)}
#splash .sl{font-size:44px;background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.4);border-radius:22px;padding:14px 18px;margin-bottom:16px}
#splash .st{font-size:22px;font-weight:800;letter-spacing:1.5px}
#splash .ss{font-size:10px;color:var(--gold);letter-spacing:1.2px;margin-top:8px;font-weight:700}
html{background:#070b16}
@media(min-width:700px){
  body{max-width:520px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .nav{left:50%;right:auto;width:496px;transform:translateX(-50%)}
  #sheet{inset:0 auto 0 50%;width:520px;transform:translateX(-50%)}
  #toast{left:50%;right:auto;width:480px;transform:translateX(-50%)}
}

/* ---- v2 layout: home feed, nearby, territory season ---- */
.top h1{font-size:16px}
#view{padding:14px 14px 8px}
.greet{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 14px}
.greet h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.2px}
.greet small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.lv{flex:none;width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--gold);border:2px solid var(--gold);background:rgba(245,197,24,.08);line-height:1.1}
.lv b{font-size:18px;color:#fff}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 6px}
.qa div{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;font-size:11px;font-weight:700;cursor:pointer}
.qa span{display:block;font-size:22px;margin-bottom:4px}
.tu{background:linear-gradient(135deg,#7c5a07 0%,#1a2a4a 62%,#0a1020 100%);border:1px solid rgba(245,197,24,.35);border-radius:22px;padding:18px;margin-bottom:6px;box-shadow:0 10px 28px rgba(0,0,0,.35);position:relative;overflow:hidden}
.tu::after{content:'';position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:
 linear-gradient(rgba(245,197,24,.18) 1px,transparent 1px) 0 0/25px 25px,linear-gradient(90deg,rgba(245,197,24,.18) 1px,transparent 1px) 0 0/25px 25px;transform:rotate(18deg);border-radius:24px;opacity:.8;pointer-events:none}
.tu .big{font-size:44px;font-weight:900;line-height:1;margin:6px 0 2px;position:relative}
.tu .sub{color:#e2e8f0;font-size:13px;position:relative;margin:0 0 14px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;margin-bottom:14px}
.stats3 div{background:rgba(10,16,32,.55);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats3 b{display:block;font-size:19px;font-weight:800}
.stats3 small{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 10px}
.sh .sec{margin:0}.sh a{font-size:12px;color:var(--gold);font-weight:700;cursor:pointer}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:2px 14px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.mini{flex:none;width:226px;scroll-snap-align:start;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.mini h4{margin:8px 0 4px;font-size:15px;font-weight:700;line-height:1.25}
.mini p{margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.45}
.mini .btn{padding:10px;font-size:12px}
.mini .ph{height:68px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 80% 20%,rgba(245,197,24,.25),transparent 50%),linear-gradient(135deg,#14532d,#1e3a8a);margin-bottom:2px}
.dist{color:var(--green);font-weight:800}
.post{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.ph-h{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#1e3a8a);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none;object-fit:cover;border:2px solid rgba(255,255,255,.15)}
.ph-h b{display:block;font-size:14px}.ph-h small{color:var(--muted);font-size:11px}
.post .cap{padding:0 16px 8px;font-size:14px;line-height:1.45}
.post h3{margin:0;padding:2px 16px 8px;font-size:17px}
.pstats{display:flex;gap:0;padding:4px 16px 12px}
.pstats div{flex:1}.pstats b{display:block;font-size:20px;font-weight:800}.pstats small{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.route{width:100%;height:150px;background:radial-gradient(circle at 50% 40%,#1c3158,#0d1730);display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.route polyline{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px rgba(245,197,24,.6))}
.noroute{height:84px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,rgba(20,83,45,.5),rgba(30,58,138,.5));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pact{display:flex;gap:6px;padding:8px 10px}
.pact button{background:transparent;border:0;color:var(--muted);font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;cursor:pointer}
.pact button.on{color:#f87171}.pact .sp{flex:1}
.season{border-color:rgba(245,197,24,.35)}
.cd{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.4px}
.chk{display:flex;align-items:center;gap:10px;margin:2px 0 12px;font-size:13px;color:#cbd5e1}.chk input{width:20px;height:20px;margin:0;accent-color:#22c55e}

/* ---- v3 detailed cards (explore, communities, events) ---- */
.dc{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:22px;margin-bottom:16px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.32)}
.dc.item:active{transform:scale(.99)}
.dc-img{position:relative;height:190px;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;overflow:hidden}
.dc-img::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,32,.15) 20%,rgba(10,16,32,.88) 100%)}
.dc-img .wm{position:absolute;right:-6px;top:6px;font-size:96px;opacity:.16;line-height:1}
.dc-img>*{position:relative}
.dc-img h3{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.2px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.dc-img .sub{font-size:12px;color:#cbd5e1}
.tag{position:absolute!important;top:14px;left:14px;padding:6px 12px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:.6px;color:#0a1020;text-transform:uppercase}
.tag2{position:absolute!important;top:14px;right:14px;padding:6px 11px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:.5px;background:rgba(10,16,32,.7);border:1px solid rgba(255,255,255,.18);color:#fbbf24;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dc-b{padding:14px 16px 4px}
.dc-b p{margin:0 0 12px;color:#cbd5e1;font-size:13.5px;line-height:1.55}
.dc-m{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.dc-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 16px}
.dc-f .nx{font-size:13px;font-weight:700;color:var(--green)}
.dc-f .nx.mu{color:var(--muted);font-weight:600}
.jb{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.55);color:var(--green);font-weight:800;font-size:14px;padding:11px 22px;border-radius:14px;cursor:pointer}
.jb[disabled]{opacity:.7}
.fc{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 16px;align-items:center}
.fc .pillx{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:11.5px;font-weight:700;color:#cbd5e1}
.fc .more{margin-left:auto;color:var(--gold);font-weight:800;font-size:12px}
.c-RUNNING{background:#a3e635}.c-WALKING{background:#38bdf8}.c-CYCLING{background:#60a5fa}.c-HIKING{background:#fb923c}.c-SWIMMING{background:#22d3ee}.c-FOOTBALL{background:#4ade80}.c-STRENGTH{background:#c084fc}.c-GYM{background:#a78bfa}.c-OTHER{background:#e2e8f0}
.g-RUNNING{background-image:linear-gradient(135deg,#365314,#14532d 55%,#0f2a4d)}.g-WALKING{background-image:linear-gradient(135deg,#075985,#0f3d3e 60%,#0f2a4d)}.g-CYCLING{background-image:linear-gradient(135deg,#1e3a8a,#312e81 60%,#0f2a4d)}.g-HIKING{background-image:linear-gradient(135deg,#7c2d12,#365314 60%,#0f2a4d)}.g-SWIMMING{background-image:linear-gradient(135deg,#155e75,#1e3a8a 60%,#0f2a4d)}.g-FOOTBALL{background-image:linear-gradient(135deg,#166534,#14532d 60%,#0f2a4d)}.g-STRENGTH,.g-GYM{background-image:linear-gradient(135deg,#581c87,#312e81 60%,#0f2a4d)}.g-OTHER{background-image:linear-gradient(135deg,#334155,#1e3a8a)}
.cityhero .dc-img{height:210px;background-image:radial-gradient(circle at 78% 18%,rgba(245,197,24,.3),transparent 45%),linear-gradient(135deg,#14532d,#1e3a8a 60%,#0a1020)}
.cityhero .eb{font-size:11px;letter-spacing:1.4px;color:var(--gold);font-weight:800;margin-bottom:4px}
.chips.act .chip{display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:13px;border-radius:16px}
.chips.act .chip.on{background:var(--green);border-color:var(--green);color:#052e16}
.dz{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dz div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.dz div.ok{border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.07)}
.dz .de{font-size:26px}.dz b{display:block;font-size:13px;margin:4px 0 2px}.dz small{display:block;color:var(--muted);font-size:11px;line-height:1.35}.dz em{display:block;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.5px;margin-top:6px;color:var(--muted)}.dz .ok em{color:var(--green)}
</style>
</head>
<body>
<div id="splash"><div class="sb"></div><div class="sl">⚡</div><div class="st">ADDIS ACTIVE</div><div class="ss">DISCOVER ADDIS · MOVE ADDIS · CONNECT ADDIS</div></div>
<div id="offline" style="display:none;background:#fbbf24;color:#000;text-align:center;font-size:12px;font-weight:700;padding:6px">Offline: saved screens only. Saving moves needs internet.</div>
<div class="top"><h1>🇪🇹 Addis Active</h1><div style="display:flex;gap:8px;align-items:center"><button class="icon" data-search aria-label="Search">🔍</button><div class="pill" id="xp">…</div></div></div>
<div id="view"><div class="card"><p>Loading Addis…</p></div></div>
<div id="sheet"></div>
<div id="toast"></div>
<div class="nav" id="nav"></div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const S = {me:null,places:[],activities:[],communities:[],joined:new Set(),records:[],tab:'home',q:'',type:'ALL',act:'ALL',err:null};
const TABS=[['home',`<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>`,'Home'],['community',`<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.6 0 4.5 1.8 4.5 4.5"/></svg>`,'Community'],['explore',`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>`,'Explore Addis'],['territory',`<svg viewBox="0 0 24 24"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><circle cx="12" cy="12" r="2.6"/></svg>`,'Territory'],['track',`<svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>`,'Track'],['journey',`<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>`,'Journey']];
const PT={PARK:'Park',ROUTE:'Route',FACILITY:'Facility',ACTIVITY_AREA:'Activity area',COMMUNITY_LOCATION:'Community location',EVENT_LOCATION:'Event location'};
const ACT={RUNNING:['🏃','Run'],WALKING:['🚶','Walk'],CYCLING:['🚴','Bike'],HIKING:['🥾','Hike'],SWIMMING:['🏊','Swim'],FOOTBALL:['⚽','Football'],STRENGTH:['🏋️','Outdoor strength'],GYM:['💪','Gym'],OTHER:['✨','Other']};
const AT=Object.keys(ACT);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const al=t=>ACT[t]?ACT[t][1]:t;
const cap=s=>s?s.charAt(0)+s.slice(1).toLowerCase():'';

const tok=()=>{try{return localStorage.getItem('aa_token')}catch(_){return null}};
async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-telegram-init-data':tg.initData||'',...(tok()&&!tg.initData?{Authorization:'Bearer '+tok()}:{})},body:body?JSON.stringify(body):undefined});
  return r.json();
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}

async function refresh(){
  try{
    const d=await api('/api/bootstrap');
    if(!d.success) throw new Error(d.error||'Load failed');
    Object.assign(S,{me:d.me,places:d.places,activities:d.activities,communities:d.communities,records:d.records,goals:d.goals||[],challenges:d.challenges||[],joined:new Set(d.joined),err:null});
  }catch(e){S.err=e.message}
  render();
  hideSplash();
  if(S.signedIn!==false)loadFeed();
}

/* ---------- helpers ---------- */
const placeById=id=>S.places.find(p=>p.id===id);
const commById=id=>S.communities.find(c=>c.id===id);
function actBadge(st){
  if(st==='DEMO'||st==='DRAFT')return `<span class="badge demo">${st}</span>`;
  if(st==='LIVE'||st==='UPCOMING')return `<span class="badge ok">${st}</span>`;
  return `<span class="badge">${esc(st)}</span>`;
}
function dataBadge(ds){
  if(ds==='VERIFIED')return '<span class="badge ok">VERIFIED</span>';
  if(ds==='TO_BE_VERIFIED')return '<span class="badge">TO BE VERIFIED</span>';
  if(ds==='DEMO')return '<span class="badge demo">DEMO</span>';
  return `<span class="badge">${esc(ds)}</span>`;
}
// Image now, video later: same component, driven by media_type/video_status.
function media(m){
  if(m&&m.media_type==='video'&&m.video_status==='video_available'&&m.url)
    return `<video class="media" src="${esc(m.url)}" poster="${esc(m.thumbnail||'')}" controls playsinline></video>`;
  const bg=m&&m.thumbnail?`background-image:url('${esc(m.thumbnail)}')`:'';
  return `<div class="media" style="${bg}"><div class="play">▶</div><div class="mt">EXPLORE THIS PLACE</div><div class="ms">Video coming soon</div></div>`;
}
function when(a){
  if(!a.date)return 'Date to be announced';
  return esc(a.date)+(a.time?' · '+esc(String(a.time).slice(0,5)):'');
}
const BGC=(t)=>`g-${ACT[t]?t:'OTHER'}`;
function imgStyle(m){return m&&m.thumbnail?`background-image:url('${esc(m.thumbnail)}')`:''}
function actTag(t){const a=ACT[t]||ACT.OTHER;return `<span class="tag c-${ACT[t]?t:'OTHER'}">${a[0]} ${esc(a[1])}</span>`}
function actCard(a){
  const pl=a.place_id?placeById(a.place_id):null, cm=a.community_id?commById(a.community_id):null, done=S.joined.has(a.id);
  return `<div class="dc"><div class="dc-img ${BGC(a.category)}"><span class="wm">${(ACT[a.category]||ACT.OTHER)[0]}</span>${actTag(a.category)}<span class="tag2">${esc(a.status)}</span><h3>${esc(a.name)}</h3>${cm?`<div class="sub">${esc(cm.name)}</div>`:''}</div>
  ${a.description?`<div class="dc-b"><p>${esc(a.description)}</p></div>`:''}
  <div class="dc-m"><span>📍 ${pl?esc(pl.name):'Location to be verified'}</span><span>📅 ${when(a)}</span></div>
  <div class="dc-f"><span class="nx ${a.date?'':'mu'}">${a.date?'Next: '+when(a):'Date to be announced'}</span><button class="jb" data-join="${a.id}" ${done?'disabled':''}>${done?'Joined ✓':'Join ›'}</button></div></div>`;
}
function placeX(p){
  const d=placeDist(p),acts=(p.activity_types||[]),first=acts[0]||'OTHER';
  const n=S.activities.filter(a=>a.place_id===p.id&&a.status!=='CANCELLED').length;
  return `<div class="dc item" data-place="${p.id}"><div class="dc-img ${BGC(first)}" style="${imgStyle(p.media)}"><span class="wm">${(ACT[first]||ACT.OTHER)[0]}</span>${actTag(first)}${p.featured?'<span class="tag2">⭐ FEATURED</span>':''}<h3>${esc(p.name)}</h3><div class="sub">📍 ${p.area?esc(p.area):'Addis Ababa'}${d!=null?' · <b style="color:var(--green)">'+distTxt(d)+'</b>':''}</div></div>
  <div class="dc-b"><p>${p.description?esc(p.description):'<span class="muted">Details, distance and access: information to be verified.</span>'}</p></div>
  <div class="fc"><span class="pillx">${esc(PT[p.place_type]||'Place')}</span>${acts.slice(0,3).map(t=>`<span class="pillx">${(ACT[t]||ACT.OTHER)[0]} ${esc(al(t))}</span>`).join('')}${n?`<span class="pillx">${n} activit${n===1?'y':'ies'}</span>`:''}${dataBadge(p.data_status)}<span class="more">Details ›</span></div></div>`;
}
function commX(c){
  const pl=c.primary_place_id?placeById(c.primary_place_id):null,t=c.activity_type||'OTHER';
  const today=new Date().toISOString().slice(0,10);
  const nx=S.activities.filter(a=>a.community_id===c.id&&a.status!=='CANCELLED'&&a.status!=='COMPLETED'&&a.date&&a.date>=today).sort((x,y)=>x.date<y.date?-1:1)[0];
  const sched=typeof c.schedule==='string'&&c.schedule?c.schedule:null;
  const done=nx&&S.joined.has(nx.id);
  return `<div class="dc item" data-comm="${c.id}"><div class="dc-img ${BGC(t)}"><span class="wm">${(ACT[t]||ACT.OTHER)[0]}</span>${c.activity_type?actTag(t):''}<span class="tag2">${c.data_status==='VERIFIED'?'✔ VERIFIED':'TO BE VERIFIED'}</span><h3>${esc(c.name)}</h3>${c.tagline?`<div class="sub">${esc(c.tagline)}</div>`:''}</div>
  <div class="dc-b"><p>${c.description?esc(c.description):'<span class="muted">Description, members and organizers: information to be verified.</span>'}</p></div>
  <div class="dc-m"><span>📍 ${pl?esc(pl.name):'Meeting place to be verified'}</span><span>📅 ${sched?esc(sched):'Schedule to be verified'}</span></div>
  <div class="dc-f"><span class="nx ${nx?'':'mu'}">${nx?'Next: '+when(nx):'Next session to be announced'}</span>${nx?`<button class="jb" data-join="${nx.id}" ${done?'disabled':''}>${done?'Joined ✓':'Join ›'}</button>`:`<button class="jb" style="background:transparent;border-color:var(--line);color:var(--text)" data-comm="${c.id}">View ›</button>`}</div></div>`;
}

/* ---------- screens ---------- */
/* ---------- home: territory update + nearby + feed ---------- */
function ago(iso){const m=Math.floor((Date.now()-new Date(iso).getTime())/60000);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.floor(m/60);if(h<24)return h+' h ago';const d=Math.floor(h/24);return d<7?d+' d ago':new Date(iso).toLocaleDateString()}
function fmtT(sec){if(!sec)return '–';const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}:${String(s).padStart(2,'0')}`}
function seasonLeft(){
  const d=new Date(Date.now()+3*3600e3);d.setUTCHours(0,0,0,0);
  const dow=(d.getUTCDay()+6)%7;const end=d.getTime()+(7-dow)*86400e3-3*3600e3;
  const ms=Math.max(0,end-Date.now()),dd=Math.floor(ms/86400e3),hh=Math.floor(ms%86400e3/3600e3);
  return dd?`${dd}d ${hh}h`:`${hh}h ${Math.floor(ms%3600e3/60000)}m`;
}
function distTxt(m){return m<950?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km'}
function placeDist(pl){return S.loc&&pl&&pl.latitude!=null&&pl.longitude!=null?hav(S.loc,{lat:pl.latitude,lng:pl.longitude}):null}
function tuCard(){
  const held=S.me?.territory||0,w=S.me?.week||{zones:0,days:0,points:0},st=streakDays();
  const msg=!S.me?'Open from Telegram to claim zones.':held?(w.zones?`You visited ${w.zones} zone${w.zones===1?'':'s'} this week. Keep going to hold them.`:'No visits this week yet. Zones fade after 30 days without visits.'):'Track a GPS move to claim your first zone.';
  return `<div class="tu"><div class="eyebrow">TERRITORY UPDATE</div><div class="big">${held}</div><p class="sub">zone${held===1?'':'s'} held · ${msg}</p>
  <div class="stats3"><div><b>${w.zones}</b><small>ZONES THIS WEEK</small></div><div><b>${w.points}</b><small>WEEK POINTS</small></div><div><b>${st}</b><small>DAY STREAK</small></div></div>
  <div style="display:flex;gap:10px;align-items:center;position:relative"><button class="btn" data-map style="flex:1">OPEN MAP</button><span class="cd">⏱ ${seasonLeft()}<br><span style="color:var(--muted);font-weight:600">season left</span></span></div></div>`;
}
function eventCard(a){
  const pl=a.place_id?placeById(a.place_id):null,cm=a.community_id?commById(a.community_id):null,done=S.joined.has(a.id),d=placeDist(pl);
  return `<div class="mini"><div class="ph">${(ACT[a.category]||ACT.OTHER)[0]}</div><div style="margin-top:8px">${actBadge(a.status)}</div><h4>${esc(a.name)}</h4>
  <p>📅 ${when(a)}<br>📍 ${pl?esc(pl.name):'Location to be verified'}${d!=null?` · <span class="dist">${distTxt(d)}</span>`:''}${cm?`<br>👥 ${esc(cm.name)}`:''}</p>
  <button class="btn" data-join="${a.id}" ${done?'disabled':''}>${done?'JOINED ✓':'JOIN'}</button></div>`;
}
function locCard(p){
  const d=placeDist(p),em=((p.activity_types||[]).map(t=>ACT[t]&&ACT[t][0]).filter(Boolean)[0])||'📍';
  return `<div class="mini item" data-place="${p.id}"><div class="ph">${em}</div><h4>${esc(p.name)}</h4>
  <p>${esc(PT[p.place_type]||'Place')}${p.area?' · '+esc(p.area):''}${d!=null?`<br><span class="dist">${distTxt(d)} away</span>`:''}</p>${dataBadge(p.data_status)}</div>`;
}
function postCard(p){
  const a=ACT[p.type]||ACT.OTHER,init=(p.name||'?').charAt(0).toUpperCase();
  const fast=['CYCLING'].includes(p.type);
  let pace='–';
  if(p.km&&p.secs){pace=fast?(p.km/(p.secs/3600)).toFixed(1)+' km/h':(()=>{const s=p.secs/p.km;return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0')+' /km'})()}
  const pl=p.place_id&&placeById(p.place_id);
  return `<div class="post"><div class="ph-h">${p.photo?`<img class="av" src="${esc(p.photo)}" alt="">`:`<div class="av">${esc(init)}</div>`}<div><b>${p.mine?'You':esc(p.name)}</b><small>${ago(p.at)}${pl?' · '+esc(pl.name):''} · ${p.source==='gps'?'GPS':'Self-reported'}</small></div></div>
  ${p.caption?`<div class="cap">${esc(p.caption)}</div>`:''}<h3>${a[0]} ${esc(a[1])}</h3>
  <div class="pstats"><div><b>${p.km!=null?p.km.toFixed(2):'–'}</b><small>KM</small></div><div><b>${fmtT(p.secs)}</b><small>TIME</small></div><div><b>${pace}</b><small>${fast?'SPEED':'PACE'}</small></div></div>
  ${p.route?`<svg class="route" viewBox="-6 -6 112 112" preserveAspectRatio="xMidYMid meet"><polyline points="${p.route}"/></svg>`:`<div class="noroute">${a[0]}</div>`}
  <div class="pact"><button data-like="${p.id}" class="${p.liked?'on':''}">${p.liked?'❤️':'🤍'} ${p.likes||''}</button>${p.mine?`<span class="sp"></span><button data-unshare="${p.id}" style="font-size:11px">Remove from feed</button>`:''}</div></div>`;
}
function feedBlock(){
  let o=`<div class="sh"><div class="sec">COMMUNITY FEED</div></div>`;
  if(S.feed===undefined)return o+`<div class="card"><p style="margin:0">Loading moves…</p></div>`;
  if(S.feed===null)return o+`<div class="card"><p style="margin:0">Couldn't load the feed. Pull down to try again later.</p></div>`;
  if(!S.feed.length)return o+`<div class="card"><h3>No moves shared yet</h3><p>Moves from the community will show up here. Be the first.</p><button class="btn" data-tab="track">TRACK A MOVE</button></div>`;
  return o+S.feed.map(postCard).join('');
}
function home(){
  const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  const name=S.me?.first_name||tg.initDataUnsafe?.user?.first_name;
  const lvp=S.me?S.me.xp%100:0;
  let o=`<div class="greet"><div><h2>${g}${name?', '+esc(name):''}</h2><small>📍 Addis Ababa · Discover · Move · Connect</small></div>${S.me?`<div class="lv">LVL<b>${S.me.level}</b></div>`:''}</div>`;
  if(!S.me&&!S.err)o+=`<div class="card"><p style="margin:0">Open Addis Active from Telegram to join activities and track your moves.</p></div>`;
  o+=tuCard();
  o+=`<div class="qa" style="margin-top:14px"><div data-tab="track"><span>📡</span>Track</div><div data-tab="explore"><span>🧭</span>Explore</div><div data-tab="journey"><span>🎯</span>Goals</div></div>`;
  o+=goalHome();
  // Nearby: events and locations. Distance only when a place has a VERIFIED coordinate.
  const hasCoords=S.places.some(p=>p.latitude!=null);
  const evs=S.activities.filter(a=>a.status!=='COMPLETED'&&a.status!=='CANCELLED').map(a=>({a,d:placeDist(a.place_id&&placeById(a.place_id))})).sort((x,y)=>(x.d==null)-(y.d==null)||(x.d-y.d)).slice(0,8);
  const locs=S.places.map(p=>({p,d:placeDist(p)})).sort((x,y)=>(x.d==null)-(y.d==null)||(x.d-y.d)||((y.p.featured?1:0)-(x.p.featured?1:0))).slice(0,8);
  o+=`<div class="sh"><div class="sec">${S.loc?'EVENTS NEAR YOU':'EVENTS & ACTIVITIES'}</div><a data-tab="explore">See all</a></div>`;
  o+=evs.length?`<div class="hs">${evs.map(x=>eventCard(x.a)).join('')}</div>`:`<div class="card"><p style="margin:0">No events yet.</p></div>`;
  o+=`<div class="sh"><div class="sec">${S.loc?'LOCATIONS NEAR YOU':'LOCATIONS TO EXPLORE'}</div><a data-tab="explore">See all</a></div>`;
  o+=locs.length?`<div class="hs">${locs.map(x=>locCard(x.p)).join('')}</div>`:`<div class="card"><p style="margin:0">No locations yet.</p></div>`;
  if(!S.loc)o+=`<button class="btn ghost" data-useloc style="margin-top:6px">📍 USE MY LOCATION${hasCoords?' TO SORT BY DISTANCE':''}</button>${S.locErr?`<p class="muted" style="font-size:12px;margin:8px 2px 0">${esc(S.locErr)}</p>`:''}${hasCoords?'':`<p class="muted" style="font-size:12px;margin:8px 2px 0">Distances appear once place coordinates are verified.</p>`}`;
  else o+=`<p class="muted" style="font-size:12px;margin:4px 2px 0">Distances are straight-line and only shown for places with verified coordinates.</p>`;
  o+=feedBlock();
  return o;
}

async function loadFeed(){
  try{const r=await api('/api/feed');S.feed=r.success?r.posts:null}catch(_){S.feed=null}
  if(S.tab==='home'&&$('sheet').style.display!=='block'){const y=window.scrollY;render();window.scrollTo(0,y)}
}
async function useLoc(btn){
  if(btn)btn.disabled=true;
  try{const p=await geoOnce();S.loc={lat:p.lat,lng:p.lng};S.locErr=''}catch(e){S.locErr=e.message||'Could not read your location.'}
  render();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-useloc],[data-like],[data-unshare]');if(!t)return;
  if(t.dataset.useloc!==undefined)useLoc(t);
  else if(t.dataset.like){
    const p=(S.feed||[]).find(x=>x.id===t.dataset.like);if(!p)return;
    if(!S.me){toast('Open Addis Active from Telegram to like posts.');return}
    p.liked=p.liked?0:1;p.likes=Math.max(0,(p.likes||0)+(p.liked?1:-1));const y=window.scrollY;render();window.scrollTo(0,y);
    if(tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light');
    try{const r=await api('/api/like',{recordId:p.id});if(!r.success){toast(r.error||'Could not like');loadFeed()}}catch(_){loadFeed()}
  }
  else if(t.dataset.unshare){
    try{const r=await api('/api/unshare',{recordId:t.dataset.unshare});if(r.success){S.feed=(S.feed||[]).filter(x=>x.id!==t.dataset.unshare);toast('Removed from the feed');render()}else toast(r.error||'Could not remove')}catch(_){toast('Network error')}
  }
});

function explore(){
  const chips=['ALL',...Object.keys(PT)].map(t=>`<div class="chip ${S.type===t?'on':''}" data-type="${t}">${t==='ALL'?'All places':PT[t]}</div>`).join('');
  const acts=[['ALL','All',''],...Object.keys(ACT).filter(t=>t!=='OTHER').map(t=>[t,ACT[t][1],ACT[t][0]])].map(([k,l,e])=>`<div class="chip ${S.act===k?'on':''}" data-act="${k==='ALL'?(S.act==='ALL'?'ALL':S.act):k}" ${k==='ALL'?'data-actall':''}>${e?`<span>${e}</span>`:''}${l}</div>`).join('');
  return `<div class="exh"><div class="eyebrow">DISCOVER ADDIS · MOVE ADDIS</div><h2 style="margin-bottom:6px">Explore Addis</h2><p class="muted" style="margin:0 0 14px;font-size:13px">${S.places.length} places · ${S.activities.length} activities · ${S.communities.length} communities listed</p></div>
  <div class="dc cityhero"><div class="dc-img"><div class="eb">ADDIS ABABA</div><h3 style="font-size:25px">The New Flower City</h3><div class="sub" style="font-size:13px">Train at about 2,355 m above sea level</div></div></div>
  <input id="q" placeholder="Search Addis: places, activities, clubs" value="${esc(S.q)}" autocomplete="off">
  <div class="chips act">${acts}</div><div class="chips">${chips}</div><div id="results"></div>`;
}
function results(){
  const q=S.q.trim().toLowerCase(),A=S.act,hit=(...f)=>!q||f.some(x=>String(x||'').toLowerCase().includes(q));
  const pl=S.places.filter(p=>(S.type==='ALL'||p.place_type===S.type)&&(A==='ALL'||(p.activity_types||[]).includes(A))&&hit(p.name,p.area,PT[p.place_type],(p.tags||[]).join(' '),(p.activity_types||[]).map(al).join(' ')));
  const ac=(q||A!=='ALL')?S.activities.filter(a=>(A==='ALL'||a.category===A)&&hit(a.name,al(a.category),a.description)):[];
  const cm=(q||A!=='ALL')?S.communities.filter(c=>(A==='ALL'||c.activity_type===A)&&hit(c.name,al(c.activity_type),c.tagline)):[];
  let o='';
  if(ac.length)o+=`<div class="sec">ACTIVITIES</div>`+ac.map(actCard).join('');
  if(cm.length)o+=`<div class="sec">COMMUNITIES</div>`+cm.map(commX).join('');
  if(pl.length)o+=`<div class="sec">PLACES</div>`+pl.map(placeX).join('');
  $('results').innerHTML=o||`<div class="card"><p style="margin:0">Nothing listed yet${A!=='ALL'?' for '+esc(al(A)):''}. Try another activity or word.</p></div>`;
}

function community(){
  if(!S.communities.length)return `<div class="card"><p style="margin:0">Find people who move like you.</p></div>`;
  return `<div class="exh"><div class="eyebrow">CONNECT ADDIS</div><h2 style="margin-bottom:14px">Communities</h2></div>`+S.communities.map(commX).join('');
}

function track(){
  const opts=AT.map(t=>`<option value="${t}">${al(t)}</option>`).join('');
  const pls=S.places.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  let o=trackerCard()+`<div class="card"><h3>Log manually</h3><p>Self-reported, so it earns less XP than a GPS move.</p>
  <select id="l-type">${opts}</select>
  <input id="l-dist" type="number" inputmode="decimal" step="0.1" min="0" placeholder="Distance (km)">
  <input id="l-min" type="number" inputmode="numeric" min="1" placeholder="Duration (minutes)">
  <select id="l-place"><option value="">Where? (optional)</option>${pls}</select>
  <input id="l-cap" maxlength="140" placeholder="Caption for the feed (optional)">

/* ---------- GPS tracker + nearest ---------- */
const G={on:false,pts:[],type:'RUNNING',dist:0,t0:0,err:'',errN:0};
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const BG=NATIVE&&Capacitor.registerPlugin?Capacitor.registerPlugin('BackgroundGeolocation'):null;
function addPoint(lat,lng,acc,t){
  if(acc>50)return;
  const p={t,lat:+lat.toFixed(6),lng:+lng.toFixed(6)},l=G.pts[G.pts.length-1];
  if(l){if(t-l.t<2500)return;const d=hav(l,p);if(d<3)return;G.dist+=d}
  G.pts.push(p);
}
let NEAR=null;
const hav=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
function geoOnce(){return new Promise((res,rej)=>{
  const lm=tg.LocationManager;
  if(lm){
    const go=()=>lm.getLocation(l=>{
      if(l)return res({lat:l.latitude,lng:l.longitude,acc:l.horizontal_accuracy||30,t:Date.now()});
      if(lm.isAccessRequested&&!lm.isAccessGranted&&lm.openSettings)lm.openSettings();
      rej(new Error('Location is off. Allow it for this app in Telegram settings.'));
    });
    lm.isInited?go():lm.init(go);return;
  }
  if(!navigator.geolocation)return rej(new Error('Location is not supported here.'));
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()}),e=>rej(new Error(e.message||'Location error')),{enableHighAccuracy:true,timeout:15000,maximumAge:0});
})}
function trackerCard(){
  if(!G.on){
    const opts=AT.filter(t=>t!=='OTHER').map(t=>`<option value="${t}" ${G.type===t?'selected':''}>${ACT[t][0]} ${al(t)}</option>`).join('');
    return `<div class="card hero"><div class="eyebrow">GPS TRACKER</div><h3 style="color:#fff">Track a move</h3><p style="color:#cbd5e1">${NATIVE?'You can lock your screen: tracking keeps running and a notification shows while it is active.':'Keep the app open and the screen on while you move. Tracking cannot run with the screen locked.'}</p>${G.err?`<p style="color:#fca5a5">${esc(G.err)}</p>`:''}<select id="g-type">${opts}</select><input id="g-cap" maxlength="140" placeholder="Caption for the feed (optional)" value="${esc(G.cap||'')}"><label class="chk"><input type="checkbox" id="g-share" ${G.share===false?'':'checked'}> Share this move to the community feed</label><button class="btn" data-gstart>START</button></div>`;
  }
  return `<div class="card hero"><div class="eyebrow">TRACKING · ${esc(al(G.type))}</div><h2 id="g-stats" style="margin:4px 0 14px;font-size:30px">0.00 km · 0:00</h2><button class="btn" data-gstop>STOP &amp; SAVE</button><button class="btn ghost" data-gdiscard style="margin-top:8px">DISCARD</button></div>`;
}
function gTick(){const el=$('g-stats');if(el){const s=Math.floor((Date.now()-G.t0)/1000);el.textContent=(G.dist/1000).toFixed(2)+' km · '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}}
function gPoll(){geoOnce().then(p=>{G.errN=0;addPoint(p.lat,p.lng,p.acc,p.t)}).catch(()=>{G.errN++})}
async function gStart(){
  G.type=$('g-type').value;G.cap=($('g-cap')||{}).value||'';G.share=$('g-share')?$('g-share').checked:true;G.pts=[];G.dist=0;G.err='';G.errN=0;
  if(BG){
    // Native app: keeps tracking with the screen off, shows a notification while active
    let denied=false;
    try{
      G.bg=await BG.addWatcher({backgroundTitle:'Addis Active',backgroundMessage:'Tracking your move',requestPermissions:true,stale:false,distanceFilter:8},(loc,err)=>{
        if(err){if(err.code==='NOT_AUTHORIZED'){denied=true;G.err='Location permission is needed. Allow it in Settings, then try again.';if(BG.openSettings)BG.openSettings()}return}
        if(loc)addPoint(loc.latitude,loc.longitude,loc.accuracy||30,loc.time||Date.now());
      });
    }catch(e){G.err='Could not start tracking: '+(e.message||e);render();return}
    await new Promise(r=>setTimeout(r,800));
    if(denied){try{await BG.removeWatcher({id:G.bg})}catch(_){}G.bg=null;render();return}
    G.on=true;G.t0=Date.now();G.tk=setInterval(gTick,1000);render();return;
  }
  try{const p=await geoOnce();addPoint(p.lat,p.lng,p.acc,p.t)}catch(e){G.err=e.message;render();return}
  G.on=true;G.t0=Date.now();
  if(tg.enableClosingConfirmation)tg.enableClosingConfirmation();
  try{G.wl=await navigator.wakeLock.request('screen')}catch(_){}
  G.poll=setInterval(gPoll,4000);G.tk=setInterval(gTick,1000);render();
}
function gStop(){clearInterval(G.poll);clearInterval(G.tk);G.on=false;if(G.bg!=null&&BG){BG.removeWatcher({id:G.bg}).catch(()=>{});G.bg=null}try{G.wl&&G.wl.release()}catch(_){}if(tg.disableClosingConfirmation)tg.disableClosingConfirmation()}
async function gSave(){
  const pts=G.pts.slice();gStop();
  try{const r=await api('/api/track',{type:G.type,points:pts,caption:G.cap,shared:G.share!==false});toast(r.success?r.message:(r.error||'Could not save'));if(r.success)await refresh();else render()}
  catch(_){toast('Network error');render()}
}
function nearCard(){
  if(!S.places.some(p=>p.latitude!=null))return '';
  let b='<div class="sec">NEAR YOU</div><div class="card">';
  if(NEAR==='err')b+='<p>Could not read your location. Allow location access and try again.</p>';
  else if(NEAR){
    const km=d=>(d/1000).toFixed(1)+' km';
    b+=NEAR.place?`<div class="row item" data-place="${NEAR.place.x.id}"><span><b>${esc(NEAR.place.x.name)}</b><br><span class="muted">Nearest place · ${km(NEAR.place.d)} (straight line)</span></span></div>`:'';
    b+=NEAR.club?`<div class="row item" data-comm="${NEAR.club.c.id}"><span><b>${esc(NEAR.club.c.name)}</b><br><span class="muted">Nearest club · ${km(NEAR.club.d)} · meets near ${esc(NEAR.club.at.name)}</span></span></div>`:'<p style="margin:8px 0">No club with a verified meeting place yet.</p>';
  }
  return b+`<button class="btn ghost" data-near style="margin-top:10px">${NEAR&&NEAR!=='err'?'REFRESH':'FIND NEAREST'}</button></div>`;
}
async function findNear(btn){
  btn.disabled=true;
  try{
    const p=await geoOnce();
    const pl=S.places.filter(x=>x.latitude!=null&&x.longitude!=null).map(x=>({x,d:hav(p,{lat:x.latitude,lng:x.longitude})})).sort((a,b)=>a.d-b.d);
    const cl=S.communities.map(c=>{const w=c.primary_place_id&&pl.find(q=>q.x.id===c.primary_place_id);return w?{c,d:w.d,at:w.x}:null}).filter(Boolean).sort((a,b)=>a.d-b.d);
    NEAR={place:pl[0]||null,club:cl[0]||null};
  }catch(e){NEAR='err'}
  render();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-gstart],[data-gstop],[data-gdiscard],[data-near]');if(!t)return;
  if(t.dataset.gstart!==undefined)gStart();
  else if(t.dataset.gstop!==undefined)gSave();

const PRE={first5k:['First 5K','SINGLE_DISTANCE','RUNNING',5,'km'],first10k:['First 10K','SINGLE_DISTANCE','RUNNING',10,'km'],run20:['Run 20 km','DISTANCE_TOTAL','RUNNING',20,'km'],ride50:['Cycle 50 km','DISTANCE_TOTAL','CYCLING',50,'km'],routine:['Weekly routine','DAYS_ACTIVE',null,0,'days']};

}
function goalsBlock(){const gs=S.goals||[];return `<div class="sec">GOALS</div>`+(gs.length?gs.map(g=>`<div class="card">${goalBody(g)}<button class="btn ghost" data-delgoal="${g.id}" style="margin-top:12px">Remove goal</button></div>`).join('')+`<button class="btn ghost" data-newgoal>+ NEW GOAL</button>`:`<div class="card"><h3>What do you want to achieve?</h3><button class="btn" data-newgoal>SET A GOAL</button></div>`)}
function challengeBlock(){return `<div class="sec">CHALLENGES</div><div class="card">`+(S.challenges||[]).map(c=>`<div style="margin-bottom:12px"><b>${esc(c.name)}</b>${c.done?' ✅':''}<br><span class="muted">${esc(c.desc)} · ${c.progress}/${c.target}</span><div class="bar"><i style="width:${Math.round(c.progress/c.target*100)}%"></i></div></div>`).join('')+`<p style="margin:0">Addis Explorer: coming soon.</p></div>`}
function makePlan(p,level,days,weeks,act){
  const base={BEGINNER:20,REGULAR:30,EXPERIENCED:40}[level],out=[];
  for(let w=1;w<=weeks;w++){
    const rest=weeks>=4&&w%4===0,m=Math.round(base*(1+0.5*(w-1)/Math.max(weeks-1,1))*(rest?0.7:1));
    const style=act==='RUNNING'&&level==='BEGINNER'&&w<=Math.ceil(weeks/2)?'alternate 1 min easy jog with 2 min walking':'comfortable, conversational pace';
    out.push(`Week ${w}: ${days} session${days>1?'s':''} × about ${m} min, ${style}.${rest?' Easier recovery week.':''}`);
  }
  if(p[1]==='SINGLE_DISTANCE')out[weeks-1]+=` When you feel ready, go for your ${p[0]}.`;
  return out;
}

  <button class="btn" data-genplan>${w.plan?'UPDATE PLAN':'CREATE MY PLAN'}</button>
  ${w.plan?`<div class="card" style="margin-top:16px"><h3>Your plan</h3><p style="color:#e2e8f0">${w.plan.map(esc).join('<br>')}</p><p style="margin:0">General guidance only, not medical advice. Stop if you feel unwell, and talk to a doctor if you are unsure.</p></div><button class="btn" data-savegoal>SAVE THIS GOAL</button>`:''}`;

function territoryCard(){
  const n=S.me?.territory||0;
  return `<div class="card item" data-map style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px"><span><b>${n} zone${n===1?'':'s'} held</b><br><span class="muted" style="font-size:12px">Territory · claim zones with GPS moves</span></span><span style="color:var(--gold);font-weight:800">OPEN ›</span></div>`;
}
function openMap(){S.tab='territory';closeSheet();render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{if(e.target.closest('[data-map]'))openMap()});

/* ---------- Territory tab ---------- */
let ME=null;
function streakDays(){
  const k=t=>new Date(t+3*3600e3).toISOString().slice(0,10);
  const set=new Set(S.records.filter(r=>r.source==='gps').map(r=>k(new Date(r.performed_at).getTime())));
  let t=Date.now();if(!set.has(k(t)))t-=86400e3;
  let n=0;while(set.has(k(t))){n++;t-=86400e3}
  return n;
}
const DISTRICTS=[['🛫','Bole & Airport Zone','Urban tarmac corridors.',0,['bole']],['🌲','Entoto Mountain Range','High-altitude eucalyptus forests.',100,['entoto']],['🏛️','Unity & Palace Grounds','Historic gardens and walking paths.',250,['unity','piassa','arat kilo']],['🏟️','Central Sports & Aquatic Hub','Stadiums, pools and turf grounds.',400,['sport','meskel']]];
function districtsBlock(){
  const xp=S.me?.xp||0,done=DISTRICTS.filter(d=>xp>=d[3]).length;
  return `<div class="sec">DISTRICTS OF ADDIS · ${done} OF ${DISTRICTS.length} EXPLORED</div><div class="card"><p>Districts unlock as your XP grows. Tap one to see its places.</p><div class="dz">`+DISTRICTS.map((d,i)=>{
    const ok=xp>=d[3],n=S.places.filter(p=>d[4].some(k=>((p.name||'')+' '+(p.area||'')).toLowerCase().includes(k))).length;
    return `<div class="${ok?'ok':''}" data-district="${i}"><span class="de">${d[0]}</span><b>${d[1]}</b><small>${d[2]}<br>${n} place${n===1?'':'s'} listed</small><em>${ok?'EXPLORED ⚡':'NEEDS '+d[3]+' XP'}</em></div>`}).join('')+`</div></div>`;
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-district]');if(!t)return;const d=DISTRICTS[+t.dataset.district];S.q=d[4][0];S.act='ALL';S.type='ALL';S.tab='explore';closeSheet();render();window.scrollTo(0,0)});
function territory(){
  const held=S.me?.territory||0,w=S.me?.week||{zones:0,days:0,points:0};
  return `<div class="eyebrow">TERRITORY</div><h3 style="margin:0 0 12px;font-size:20px">Claim Addis, week by week</h3>
  <div class="card season"><div style="display:flex;justify-content:space-between;align-items:center"><div class="eyebrow" style="margin:0">WEEKLY SEASON</div><span class="cd">⏱ ${seasonLeft()} left</span></div>
  <div class="stats3" style="margin:12px 0 0"><div><b id="t-sp">${w.points}</b><small>YOUR POINTS</small></div><div><b id="t-sr">–</b><small id="t-sr-s">SEASON RANK</small></div><div><b>${w.zones}</b><small>ZONES THIS WEEK</small></div></div>
  <p style="margin:12px 0 0">Every Monday a new season starts. Points come from the zones you visit this week: 10 per zone-day plus up to 5 for effort.</p></div>
  <div class="tiles"><div class="tile"><span class="te">${held}</span><b>Zones held</b></div><div class="tile"><span class="te">${streakDays()}</span><b>Day streak</b><small>GPS moves</small></div><div class="tile"><span class="te" id="t-rank">–</span><b>Zone rank</b><small id="t-rank-s">&nbsp;</small></div></div>
  <div id="map"></div>
  <button class="btn ghost" data-recenter style="margin-top:10px">📍 CENTER ON ME</button>
  <div class="card" style="margin-top:14px"><h3>How zones work</h3><p style="margin:0"><span style="color:var(--gold)">■</span> Yours &nbsp; <span style="color:var(--blue)">■</span> Another mover. Tap a zone for details.<br><br>Each zone is about 275 m wide. Walk, run or ride with GPS to visit zones. Over 30 days, the mover with the most points holds a zone: <b>10 points for every day you visit</b> (consistency) plus <b>up to 5 for how hard you move</b> (intensity). Come back often and push your pace to take zones over.</p></div>
  ${districtsBlock()}
  <div class="sec">THIS WEEK'S TOP MOVERS</div><div class="card" id="slb"><p style="margin:0">Loading…</p></div>
  <div class="sec">MOST ZONES HELD</div><div class="card" id="lb"><p style="margin:0">Loading…</p></div>`;
}
function locate(){geoOnce().then(p=>{if(!MAP)return;MAP.setView([p.lat,p.lng],15);if(ME)ME.remove();ME=L.circleMarker([p.lat,p.lng],{radius:7,color:'#fff',weight:2,fillColor:'#22c55e',fillOpacity:1}).addTo(MAP)}).catch(()=>{})}
function initTMap(){
  if(!$('map'))return;
  if(!window.L){$('map').innerHTML='<p style="padding:16px">The map could not load. Check your connection.</p>';return}
  if(MAP){MAP.remove();MAP=null}
  MAP=L.map('map').setView([9.03,38.76],13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(MAP);
  LAYER=L.layerGroup().addTo(MAP);
  const draw=async()=>{
    if(!MAP)return;
    if(MAP.getZoom()<12){LAYER.clearLayers();return}
    const b=MAP.getBounds();
    try{
      const r=await api(`/api/territory?s=${b.getSouth()}&w=${b.getWest()}&n=${b.getNorth()}&e=${b.getEast()}`);
      if(!r.success)return;
      LAYER.clearLayers();
      r.cells.forEach(k=>L.rectangle([[k.y*0.0025,k.x*0.0025],[(k.y+1)*0.0025,(k.x+1)*0.0025]],{stroke:true,weight:1,color:k.m?'#f5c518':'#60a5fa',fillColor:k.m?'#f5c518':'#60a5fa',fillOpacity:Math.min(.75,.25+k.s/120)}).bindPopup(k.m?`<b>Held by you</b><br>${k.s} points`:`<b>Held by another mover</b><br>${k.s} points<br>Visit on more days and move faster to take it.`).addTo(LAYER));
    }catch(_){}
  };
  MAP.on('moveend',draw);
  setTimeout(()=>{MAP.invalidateSize();draw()},150);
  locate();
  api('/api/leaderboard').then(r=>{
    if(!r.success)return;
    if($('t-rank')){$('t-rank').textContent=r.rank?'#'+r.rank:'–';$('t-rank-s').textContent=r.movers?'of '+r.movers+' movers':'no movers yet'}
    const se=r.season;
    if(se){
      if($('t-sp'))$('t-sp').textContent=se.points;
      if($('t-sr')){$('t-sr').textContent=se.rank?'#'+se.rank:'–';$('t-sr-s').textContent=se.movers?'OF '+se.movers+' MOVERS':'NO MOVERS YET'}
      if($('slb'))$('slb').innerHTML=se.top.length?se.top.map((t,i)=>`<div class="row" style="${t.me?'color:var(--gold);font-weight:800':''}"><span>${i+1}. ${t.me?'You':'Mover'}</span><span>${t.points} pts</span></div>`).join(''):'<p style="margin:0">No points yet this week. Track a GPS move to start the season.</p>';
    }
    if($('lb'))$('lb').innerHTML=r.top.length?r.top.map((t,i)=>`<div class="row" style="${t.me?'color:var(--gold);font-weight:800':''}"><span>${i+1}. ${t.me?'You':'Mover'}</span><span>${t.zones} zone${t.zones===1?'':'s'}</span></div>`).join(''):'<p style="margin:0">No zones claimed yet. Be the first: track a GPS move.</p>';
  }).catch(()=>{});
}
document.addEventListener('click',e=>{if(e.target.closest('[data-recenter]'))locate()});

/* ---------- website sign-in + PWA ---------- */
async function mountLogin(){
  const el=$('tg-login');if(!el)return;
  let c={};try{c=await api('/api/config')}catch(_){}
  if(!c.botUsername){el.innerHTML='<p style="color:#fca5a5;margin:0">Website sign-in is not configured yet.</p>';return}
  window.onTgAuth=async u=>{
    try{const r=await api('/api/web-login',u);
      if(r.success){try{localStorage.setItem('aa_token',r.token)}catch(_){}await refresh()}else toast(r.error||'Sign-in failed')}
    catch(_){toast('Network error')}
  };
  const s=document.createElement('script');s.async=true;s.src='https://telegram.org/js/telegram-widget.js?22';
  s.setAttribute('data-telegram-login',c.botUsername);s.setAttribute('data-size','large');s.setAttribute('data-radius','12');
  if(NATIVE)s.setAttribute('data-auth-url',location.origin+'/api/tg-callback');else s.setAttribute('data-onauth','onTgAuth(user)');s.setAttribute('data-request-access','write');
  el.appendChild(s);
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-signout]')){try{localStorage.removeItem('aa_token')}catch(_){}S.me=null;S.signedIn=false;render()}
});
if('serviceWorker' in navigator&&!tg.initData)navigator.serviceWorker.register('/sw.js').catch(()=>{});

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-delgoal]');if(!t)return;
  const ok=await new Promise(r=>tg.initData&&tg.showConfirm?tg.showConfirm('Remove this goal?',r):r(confirm('Remove this goal?')));
  if(!ok)return;
  try{const r=await api('/api/goal-delete',{id:t.dataset.delgoal});toast(r.success?'Goal removed':(r.error||'Could not remove'));if(r.success)await refresh()}
  catch(_){toast('Network error')}
});

/* ---------- from the old PWA: search shortcut, offline banner, splash ---------- */
function hideSplash(){const s=$('splash');if(s){s.style.opacity=0;setTimeout(()=>s&&s.remove(),450)}}
setTimeout(hideSplash,6000);
document.addEventListener('click',e=>{
  if(e.target.closest('[data-search]')&&S.signedIn){S.tab='explore';closeSheet();render();setTimeout(()=>{const q=$('q');if(q)q.focus()},80)}
});
const offl=()=>{$('offline').style.display=navigator.onLine?'none':'block'};
window.addEventListener('online',offl);window.addEventListener('offline',offl);offl();

refresh();
</script>
