<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Active</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            color: #38bdf8;
            margin: 0 0 8px 0;
            font-size: 24px;
        }
        .header p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        .card p {
            color: #cbd5e1;
            font-size: 14px;
            margin: 0 0 16px 0;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:active {
            background: #1d4ed8;
        }
        #success-msg {
            display: none;
            background: #065f46;
            color: #6ee7b7;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🇪🇹 Addis Active</h1>
        <p>Discover & Connect with Addis through Movement</p>
    </div>

    <div class="card">
        <h3>Entoto Bertusew Run</h3>
        <p>📍 Entoto Park<br>🏃‍♂️ Distance: 5KM Morning Trail<br>🌟 Connect with the community at the peak of the city.</p>
        <button class="btn" onclick="joinRun()">JOIN RUN</button>
        <div id="success-msg">🎉 You're officially registered for the run!</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function joinRun() {
            document.querySelector('.btn').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }
    </script>
</body>
</html>
